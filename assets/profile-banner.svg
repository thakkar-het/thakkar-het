<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Het Thakkar — AI, Algorithms, Robotics</title>
  <desc id="desc">A dark navy technical banner with abstract network nodes and a simple grid motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#172b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#62e6c5"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d2e8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".7">
    <path d="M800 65L900 115L1000 65L1100 125L1030 220L900 245L820 180L900 115L1030 220"/>
    <path d="M1000 65L1030 220M900 245L1100 125M820 180L1000 65"/>
  </g>
  <g fill="#62e6c5">
    <circle cx="800" cy="65" r="5"/><circle cx="900" cy="115" r="6"/>
    <circle cx="1000" cy="65" r="5"/><circle cx="1100" cy="125" r="5"/>
    <circle cx="1030" cy="220" r="6"/><circle cx="900" cy="245" r="5"/>
    <circle cx="820" cy="180" r="5"/>
  </g>
  <g fill="#eaf2fb">
    <text x="72" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="5" fill="#62e6c5">COMPUTER SCIENCE · IIT JODHPUR</text>
    <text x="68" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700">Het Thakkar</text>
    <text x="72" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#c5d4e4">Algorithms  /  Reinforcement Learning  /  Robotics</text>
    <text x="72" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2" fill="#8ea5ba">BUILD · UNDERSTAND · DEBUG · IMPROVE</text>
  </g>
  <rect x="72" y="135" width="82" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
